<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="heading">
        <h1>Simple Calculator</h1>
    </div>
    
    <div class="calc-container">
        <div class="calculator">
            <div class="display" id="display"></div>
            <div class="button-container">
                <div class="row first">
                    <button type="button" class="button disp">7</button>
                    <button type="button" class="button disp">8</button>
                    <button type="button" class="button disp">9</button>
                    <button type="button" class="button disp oper" id="div">/</button>
                </div>
                <div class="row second">
                    <button type="button" class="button disp">4</button>
                    <button type="button" class="button disp">5</button>
                    <button type="button" class="button disp">6</button>
                    <button type="button" class="button disp oper" id="mult">*</button>
                </div>
                <div class="row third">
                    <button type="button" class="button disp">1</button>
                    <button type="button" class="button disp">2</button>
                    <button type="button" class="button disp">3</button>
                    <button type="button" class="button disp oper" id="sub">-</button>
                </div>
                <div class="row fourth">
                    <button type="button" class="button disp">0</button>
                    <button type="button" class="button disp" id="period">.</button>
                    <button type="button" class="button" id="eq">=</button>
                    <button type="button" class="button disp oper" id="plus">+</button>
                </div>
                <div class="row fifth">
                    <button type="button" class="button" id="clear">AC</button>
                    <button type="button" class="button" id="del">DEL</button>
                </div>
            </div>
        </div> 
    </div>
    <script src="./main.js"></script>
</body>
</html>
