<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="heading">
        <h1>Simple Calculator</h1>
    </div>
    
    <div class="calc-container">
        <div class="calculator">
            <div class="display" id="display">
                <div class="last" id="lastDisp"></div>
                <div class="curr" id="currDisp"></div>
            </div>
            <div class="button-container">
                <div class="row first">
                    <button type="button" class="button num">7</button>
                    <button type="button" class="button num">8</button>
                    <button type="button" class="button num">9</button>
                    <button type="button" class="button oper" id="div">/</button>
                </div>
                <div class="row second">
                    <button type="button" class="button num">4</button>
                    <button type="button" class="button num">5</button>
                    <button type="button" class="button num">6</button>
                    <button type="button" class="button oper" id="mult">*</button>
                </div>
                <div class="row third">
                    <button type="button" class="button num">1</button>
                    <button type="button" class="button num">2</button>
                    <button type="button" class="button num">3</button>
                    <button type="button" class="button oper" id="sub">-</button>
                </div>
                <div class="row fourth">
                    <button type="button" class="button num">0</button>
                    <button type="button" class="button" id="period">.</button>
                    <button type="button" class="button" id="eq">=</button>
                    <button type="button" class="button oper" id="plus">+</button>
                </div>
                <div class="row fifth">
                    <button type="button" class="button" id="clear">AC</button>
                    <button type="button" class="button" id="del">DEL</button>
                </div>
            </div>
        </div> 
    </div>
    <script src="./main.js"></script>
</body>
</html>
