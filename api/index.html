<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="#">
    <form method="post" action="" id="form">
        <label for="topic">Enter GIF topic</label>
        <input type="text" name="topic" id="topic" placeholder="cat">
        <button type="submit" id="submit">Submit</button>
    </form>
    <script>
        const img = document.querySelector('img');
        const btn = document.getElementById('submit');
        const apiForm = document.getElementById('form')
        let url = 'https://api.giphy.com/v1/gifs/translate?api_key=HopxglVK6ZZPQB0QkcmDYkPWgYZ3BzWN&s=';

        btn.addEventListener('click', async function(e){
            e.preventDefault();
            const formData = new FormData(apiForm);
            const data = Object.fromEntries(formData.entries());
            url += data.topic;
            try {
                const response = await fetch(url);
                if (!response.ok){
                    throw new Error(`Response status: ${response.status}`);
                }
                const json = await response.json();
                img.src = json.data.images.original.url;
            } catch (error) {
                console.log(error.message);
            }
                


        })

        
        
    </script>
    
</body>
</html>
