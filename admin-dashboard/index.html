<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <aside>
            <div class="dashboard">
                <img class="side-icon large" src="./icons/view-dashboard.svg">
                <h1>Dashboard</h1>
            </div>
            <div class="nav">
                <div>
                    <img class="side-icon" src="./icons/home-account.svg">
                    <h4>Home</h4>
                </div>
                <div>
                    <img class="side-icon" src="./icons/face-man-profile.svg">
                    <h4>Profile</h4>
                </div>
                <div>
                    <img class="side-icon"  src="./icons/message-alert.svg">
                    <h4>Messages</h4>
                </div>
                <div>
                    <img class="side-icon" src="./icons/history.svg">
                    <h4>History</h4>
                </div>
                <div>
                    <img class="side-icon" src="./icons/checkbox-marked-circle-plus-outline.svg">
                    <h4>Tasks</h4>
                </div>
                <div>
                    <img class="side-icon" src="./icons/community.svg">
                    <h4>Communities</h4>
                </div>
            </div>
            <div class="nav2">
                <div>
                    <img class="side-icon" src="./icons/cog.svg">
                    <h4>Settings</h4>
                </div>
                <div>
                    <img class="side-icon" src="./icons/help.svg">
                    <h4>Support</h4>
                </div>
                <div>
                    <img class="side-icon" src="./icons/shield-check.svg">
                    <h4>Privacy</h4>
                </div>
            </div>
        </aside>
        <header>Header</header>
        <main>
            <section class="projects">Projects</section>
            <section class="announcements">Anouncements</section>
            <section class="trending">Trending</section>
        </main>
    </div>
</body>
</html>
