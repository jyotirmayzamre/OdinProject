<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <div class="picture">
            <div class="logo-container">
                <div>
                    <img class="logo" src="./odin-lined.png">
                </div>
                <h1>ODIN</h1>
            </div>
            <img class='background' src="./background.jpg">
        </div>
        <div class="content">
            <section class="message">
                <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <i>now</i> to get started.</p>
                <p>You <i>know</i> you want to.</p>
            </section>
            <section class="signup-form">
                <form action="/signup" method="post">
                    <div class="form-content">
                        <h1>Let's do this!</h1>
                        <fieldset>
                            <div>
                                <label for="first-name">FIRST NAME</label>
                                <input type="text" id="first-name" name="first-name">
                            </div>
                            <div>
                                <label for="last-name">LAST NAME</label>
                                <input type="text" id="last-name" name="last-name">
                            </div>    
                        </fieldset>
                        <fieldset>
                            <div>
                                <label for="email">EMAIL</label>
                                <input type="email" id="email" name="email">
                            </div>
                            <div>
                                <label for="phone">PHONE NUMBER</label>
                                <input type="tel" id="phone" name="phone">
                            </div>
                        </fieldset>
                        <fieldset>
                            <div>
                                <label for="password">PASSWORD</label>
                                <input type="password" id="password" name="password">
                            </div>
                            <div>
                                <label for="conf-password">CONFIRM PASSWORD</label>
                                <input type="password" id="conf-password" name="conf-password">
                            </div>
                        </fieldset>
                    </div>
                    <div class="footer">
                        <button type="submit">Create Account</button>
                        <p>Already have an account? <a>Log In</a></p>
                    </div>

                </form>
            </section>
        </div>
    </div>
</body>
</html>
