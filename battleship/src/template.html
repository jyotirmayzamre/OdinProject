<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
</head>
<body>
    <header>
        <h1>Battleship</h1>
    </header>
    <div class="result-container">
        <h1 id="result"></h1>    
    </div>
    <div class="dir">
            <button id="horizontal" class="btn pressed">Horizontal</button>
            <button id="vertical" class="btn">Vertical</button>
        </div>
    <main>
        <div class="container own">
            <h1>Friendly Waters</h1>
            <div class="grid" id="friendly">

            </div>
        </div>
        <div class="container ai">
            <h1>Enemy Waters</h1>
            <div class="grid" id="enemy">

            </div>
        </div>
        
    </main> 
    <dialog id="gameOver">
    </dialog>
</body>
</html>
